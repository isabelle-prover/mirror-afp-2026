title = "Foundations and Limits of Essentially Ordered Causal Regress Arguments"
date = 2026-08-07
topics = [
  "Logic/Philosophical aspects",
  "Logic/General logic/Mechanization of proofs",
  "Mathematics/Graph theory",
  "Mathematics/Order",
]
abstract = "This entry formalizes a carrier-restricted theory of causal and grounding regress arguments in Isabelle/HOL. It distinguishes acyclicity, well-foundedness, explicit chain termination, local foundation, global foundation, and full grounding, and proves the valid implications together with finite and infinite separation models. An executable finite checker returns either an exact independent-root certificate or a concrete missing-foundation witness. A bounded cycle analyzer produces explicit finite return-path certificates, and a certified finite profile links five declarative properties to two executable tests. The entry also formalizes Cohoe-style and Romero-Pérez-style Second-Way reconstructions with explicit translation assumptions and premise-deletion countermodels. All conclusions are conditional on stated dependency premises; no formal first cause is identified with God, and the First and Third Ways are deliberately outside scope."
license = "bsd"
note = ""
creation_note = "AI assistance was used for proof engineering. The final definitions, statements, and proofs are checked by Isabelle."

