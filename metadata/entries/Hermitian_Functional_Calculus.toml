title = "The Functional Calculus of Hermitian Matrices and Product Formulas"
date = 2026-10-24
topics = [
  "Mathematics/Algebra",
  "Mathematics/Analysis",
  "Computer science/Algorithms/Quantum computing",
]
abstract = """
For a Hermitian matrix \\(A\\) and a function \\(g:\\mathbb{R}\\to\\mathbb{C}\\), we define \\(g(A)\\) as the matrix that multiplies every eigenvector of \\(A\\) with eigenvalue \\(\\lambda\\) by \\(g(\\lambda)\\). We prove that this matrix exists and is unique, and establish the algebraic properties of this functional calculus: it is linear in \\(g\\), \\(g(A)h(A)=(gh)(A)\\), \\(g(A)^*=\\overline{g}(A)\\), \\(g(A)^k=(g^k)(A)\\), and \\(g(f(A))=(g\\circ f)(A)\\) for real-valued \\(f\\). We also prove that \\(g(A)\\) is unitary when \\(|g|=1\\) on the spectrum of \\(A\\), and that \\(g(A)\\) depends only on the values of \\(g\\) on that spectrum.

Special cases include the time evolution \\(e^{itA}\\), satisfying \\(e^{isA}e^{itA}=e^{i(s+t)A}\\), and the matrix inverse. We further verify the Lie–Trotter product formula with an explicit error bound,
\\[
\\left\\|(e^{itH_1/r}\\cdots e^{itH_m/r})^r-e^{it(H_1+\\cdots+H_m)}\\right\\|
\\le \\frac{2(mLt)^2}{r},
\\]
for Hermitian matrices \\(H_j\\) with norm at most \\(L\\).

Finally, we formalize Suzuki's higher-order product formulas, proving the order conditions that palindromic formulas have odd order and that Suzuki's recursion \\(S_{2k+2}\\) agrees with \\(e^{itH}\\) through degree \\(2k+2\\) in its Taylor expansion. For \\(r\\) steps of a formula with \\(|F|\\) factors and total weight \\(\\Lambda\\), we prove the error bound
\\[
\\frac{r(2|F|+1)(\\Lambda|t|/r)^{2k+3}e^{\\Lambda|t|/r}}{(2k+3)!}.
\\]
The development uses the matrices defined in <em>Jordan_Normal_Form</em>, with the spectral theorem derived from the Schur decomposition in <em>QHLProver</em>."""
