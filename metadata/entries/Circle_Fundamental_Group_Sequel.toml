title = "Path Lifting and Homology of the Circle and Punctured Plane"
date = 2026-10-27
topics = [
  "Mathematics/Topology",
]
abstract = "We formalize real path lifts of based loops in the circle and prove that their integer endpoints classify these loops up to path homotopy. For the torus, the two coordinate lifts give a classification by pairs of integers and an explicit fundamental-group isomorphism with \\(\\mathbb{Z}\\times\\mathbb{Z}\\). Every continuous circle self-map acts on first singular homology by multiplication by its winding number. We construct a radial deformation retraction of the punctured complex plane onto the circle and compute the reduced homology of both spaces: it is isomorphic to the additive group of integers in degree one and trivial in every other degree. Neither space is contractible. The development also provides a reusable interface for path lifting in covering spaces."
