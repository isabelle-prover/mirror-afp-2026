title = "Tokenization, Indentation-sensitive Grammars & Executable Recognizers"
date = 2026-11-13
topics = [
  "Computer science/Automata and formal languages",
  "Computer science/Programming languages/Compiling",
  "Tools",
]
abstract = "Two definitional packages for Isabelle/HOL that turn the source text of a language into verified values: The command \\textbf{lexer} elaborates a flex-style specification, with modes, longest match and rule priority, into an inductive lexing judgment and an executable lexer on precomputed DFA tables. The command \\textbf{grammar} elaborates an indentation-sensitive context-free grammar with semantic actions into a grammar specification, decoders from parse trees to the values of the semantic actions and an inductive relation. The related command \\textbf{parser} emits an executable LR parser for it. Both executable constants for lexing and parsing are proved sound and complete with respect to their specifications. The parser completeness, and with it the unambiguity of the grammar, follows from an LALR conflict analysis that the command carries out by evaluation."
