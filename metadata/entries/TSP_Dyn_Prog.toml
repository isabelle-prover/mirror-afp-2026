title = "Travelling Salesman via dynamic programming"
date = 2026-09-24
topics = [
  "Computer science/Algorithms/Optimization",
]
abstract = """
<i>Travelling Salesman Problem</i> (TSP) is well-known to be NP-hard.
The computational solution, derived in this theory,
follows the Bellman-Held-Karp approach 
utilising the power set of locations to be visited by the salesman."""
